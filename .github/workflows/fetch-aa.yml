name: Fetch Artificial Analysis

on:
  schedule:
    - cron: '17 2 * * *'  # Daily at 02:17 UTC (10:17 CST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FetchArtificial Analysis intelligence index
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/fetch_aa.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-aa/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "data: update artificial analysis $DATE"
            git push
          fi
