name: Fetch Arena Leaderboards

on:
  schedule:
    - cron: '37 1 * * *'  # Daily at 01:37 UTC (09:37 CST)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema pyarrow

      - name: Fetch leaderboards from HuggingFace dataset
        run: python scripts/fetch_hf.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ BOARDS.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "data: update leaderboards $DATE"
            git push
          fi
