name: probe-hf

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hf:
    runs-on: ubuntu-latest
    steps:
      - name: huggingface reachability + dataset listing
        run: |
          set +e
          echo "== hf api =="
          curl -sS -m 40 -o /tmp/hf.json -w "http=%{http_code} bytes=%{size_download} ip=%{remote_ip}\n" https://huggingface.co/api/datasets/lmarena-ai/leaderboard-dataset
          head -c 300 /tmp/hf.json; echo
          echo "== hf tree =="
          curl -sS -m 40 -o /tmp/tree.json -w "http=%{http_code} bytes=%{size_download}\n" https://huggingface.co/api/datasets/lmarena-ai/leaderboard-dataset/tree/main
          head -c 1200 /tmp/tree.json; echo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: read parquet schema with pyarrow
        run: |
          set +e
          pip install -q pyarrow
          python - <<'PY'
          import json, urllib.request
          BASE = "https://huggingface.co/api/datasets/lmarena-ai/leaderboard-dataset"
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "probe"})
              return urllib.request.urlopen(r, timeout=90).read()
          tree = json.loads(get(BASE + "/tree/main"))
          files = [(t["path"], t.get("size")) for t in tree if t["type"] == "file"]
          print("FILES:", files[:25])
          pq = [f for f, s in files if f.endswith(".parquet")]
          if pq:
              url = "https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset/resolve/main/" + pq[0]
              data = get(url)
              open("/tmp/a.parquet", "wb").write(data)
              print("PARQUET:", pq[0], "bytes:", len(data))
              import pyarrow.parquet as pqa
              t = pqa.read_table("/tmp/a.parquet")
              print("SCHEMA:", t.schema.names)
              print("ROWS:", t.num_rows)
              print("SAMPLE:", json.dumps(t.slice(0, 2).to_pylist(), ensure_ascii=False)[:1200])
          PY
