name: probe-hf2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hf2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pyarrow
        run: pip install -q pyarrow
      - name: probe dataset
        run: python .github/probe_hf.py
